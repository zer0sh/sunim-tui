[package]
name = "sunim-tui"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
description = "Terminal UI for managing Pantheon sites via the Terminus CLI"
license = "MIT"
readme = "README.md"
keywords = ["pantheon", "terminus", "tui", "ratatui", "cli"]
categories = ["command-line-utilities"]
repository = "https://github.com/zer0-sh/sunim-tui"
homepage = "https://github.com/zer0-sh/sunim-tui"

[[bin]]
name = "sunim"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
toml = "1"

# Small release binaries. `panic` stays "unwind" on purpose: App::spawn turns a
# panicking background task into an error in the UI instead of killing the app.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
